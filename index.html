<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>NIEU</title>
        <meta name="description" content="You don't have any choice in this...">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <meta name="theme-color" content="#0a0a0b">
        <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23111'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23e8322b'/%3E%3Ccircle cx='16' cy='16' r='1.5' fill='%23111'/%3E%3C/svg%3E">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;700&display=swap">
        <link rel="stylesheet" href="css/main.css">
    </head>
    <body>
        <div class="app">
            <header class="top">
                <h1 id="word">NIEU</h1>
                <p class="tagline">You don't have any choice in this...</p>
            </header>

            <div class="stage" id="stage" role="button" tabindex="0" aria-label="Pause or replay">
                <video id="bgvid" src="video/nieu.mp4" playsinline autoplay muted loop></video>
                <p id="tally" class="tally" aria-live="polite"></p>
            </div>

            <p id="subtitle" class="subtitle" aria-live="polite"></p>

            <section class="dock">
                <div class="clips" role="group" aria-label="Pick a clip">
                    <button class="chip" data-clip="nieu" aria-pressed="true">Just Nieu</button>
                    <button class="chip" data-clip="short" aria-pressed="false">Short</button>
                    <button class="chip" data-clip="long" aria-pressed="false">Long</button>
                    <button class="chip" data-clip="bonus" aria-pressed="false">Bonus</button>
                    <button class="chip chip-extreme" data-clip="extreme" aria-pressed="false">EXTREME NIEU!!!</button>
                    <button class="chip chip-loop" id="loop" aria-pressed="false">Loop</button>
                </div>

                <div class="big-wrap">
                    <button id="nieu" class="big" aria-label="Nieu. Hold to stretch.">NIEU</button>
                    <p class="big-hint">Hold to stretch<span class="keys"> &middot; or press <kbd>N</kbd></span></p>
                </div>

                <section class="deck" aria-label="Nieu turntable">
                    <div class="platter">
                        <div class="record" id="record" role="slider" aria-label="Scratch the record" aria-valuetext="Nieu" tabindex="0">
                            <div class="label">NIEU<small>Refusal Records &middot; 33&frac13;</small></div>
                        </div>
                        <div class="arm" aria-hidden="true"></div>
                    </div>
                    <div class="deck-controls">
                        <button id="motor" class="chip" aria-pressed="false">&#9654; Start</button>
                        <span class="deck-hint">Drag the record to scratch</span>
                    </div>
                    <p id="deckError" class="deck-error" hidden></p>
                </section>

                <form id="ask" class="ask">
                    <label for="question">Ask the Freeman</label>
                    <div class="ask-row">
                        <input id="question" type="text" placeholder="Can I leave early?" autocomplete="off" enterkeyhint="send" required>
                        <button type="submit">Ask</button>
                    </div>
                    <p id="answer" class="answer" aria-live="polite"></p>
                </form>
            </section>

            <footer class="foot">
                <a id="originalLink" href="https://www.youtube.com/watch?v=Ep0z9UiI5io&t=44" target="_blank" rel="noopener">Watch the original &nearr;</a>
            </footer>
        </div>

        <!-- Browsers block sound until the first tap, so make that tap part of the joke -->
        <button id="splash" class="splash">
            <span class="splash-title">Tap to be refused</span>
            <span class="splash-sub">Sound on</span>
        </button>

        <!-- Greetings from Ewokoniad -->
        <img id="myImg" src="img/ewokoniad.jpg" alt="Greetings from Ewokoniad" width="10" height="10">
        <dialog id="ewok" class="ewok">
            <button class="close" aria-label="Close">&times;</button>
            <img src="img/ewokoniad.jpg" alt="">
            <p>Greetings from Ewokoniad</p>
        </dialog>

        <script src="js/main.js"></script>
    </body>
</html>
